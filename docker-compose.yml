version: "3.9"

services:
  chroma:
    image: chromadb/chroma:0.5.5
    volumes:
      - chroma-data:/data
    networks:
      - rag-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - UPLOAD_DIR=/app/data/uploads
      - IMAGES_DIR=/app/data/images
    depends_on:
      - ollama
      - chroma
    networks:
      - rag-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - rag-net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - rag-net

volumes:
  ollama-data:
  chroma-data:

networks:
  rag-net:
    driver: bridge